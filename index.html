<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pano VR">
<title>Pano Cardboard</title>
<style>
:root{--bg:#0d0f0e;--fg:#e9ece8;--mute:#8d958f;--line:#2a2f2c;--acc:#c8d96a;--font:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
#panel{pointer-events:auto;background:rgba(13,15,14,.88);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(420px,100%);display:grid;gap:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
p{margin:0;font-size:12px;line-height:1.6;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,label.btn,select{font:inherit;font-size:14px;color:var(--fg);background:#1a1e1b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600;flex:1}
input[type=file]{display:none}
#status{font-size:12px;color:var(--acc);min-height:1em}
#hint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.45);pointer-events:none}
#divider{position:fixed;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#333;display:none;pointer-events:none}
body.vr #divider{display:block}
</style>
</head>
<body>
<div id="divider"></div>
<div id="ui"><div id="panel">
  <h1>Pano Cardboard</h1>
  <p>360°パノラマ（2:1の正距円筒画像）を読み込み、横向きにしてゴーグルへ。画面をタップするとこのパネルに戻ります。</p>
  <div class="row">
    <label class="btn" for="file">画像を選ぶ</label>
    <input id="file" type="file" accept="image/*">
    <select id="layout" aria-label="画像の形式">
      <option value="mono">通常（モノ）</option>
      <option value="tb">ステレオ（上下）</option>
      <option value="sbs">ステレオ（左右）</option>
    </select>
  </div>
  <div class="row">
    <button id="look">ドラッグで見る</button>
    <button id="vr" class="primary">ゴーグルで見る</button>
  </div>
  <div id="status"></div>
</div></div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const R = new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight);
document.body.prepend(R.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 2000);
cam.layers.enable(1); cam.layers.enable(2);

const geo = new THREE.SphereGeometry(500,64,40); geo.scale(-1,1,1);
const matL = new THREE.MeshBasicMaterial(), matR = new THREE.MeshBasicMaterial();
const sL = new THREE.Mesh(geo,matL), sR = new THREE.Mesh(geo,matR);
sL.layers.set(1); sR.layers.set(2);
scene.add(sL,sR);

const status = document.getElementById('status');
const hint = document.getElementById('hint');
let tex = null, layout = 'mono';

function applyTexture(img){
  if(tex) tex.dispose();
  tex = new THREE.Texture(img); tex.needsUpdate = true;
  tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const tL = tex, tR = tex.clone(); tR.needsUpdate = true;
  [tL,tR].forEach(t=>{t.repeat.set(1,1);t.offset.set(0,0);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false});
  if(layout==='tb'){ tL.repeat.set(1,.5); tL.offset.set(0,.5); tR.repeat.set(1,.5); tR.offset.set(0,0); }
  if(layout==='sbs'){ tL.repeat.set(.5,1); tL.offset.set(0,0); tR.repeat.set(.5,1); tR.offset.set(.5,0); }
  matL.map = tL; matR.map = tR; matL.needsUpdate = matR.needsUpdate = true;
}

function sample(){
  const c = document.createElement('canvas'); c.width=2048; c.height=1024;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,512); sky.addColorStop(0,'#1b2a3a'); sky.addColorStop(1,'#9fb4c4');
  g.fillStyle=sky; g.fillRect(0,0,2048,512);
  g.fillStyle='#3b3a33'; g.fillRect(0,512,2048,512);
  g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2;
  for(let x=0;x<=2048;x+=128){g.beginPath();g.moveTo(x,0);g.lineTo(x,1024);g.stroke()}
  for(let y=0;y<=1024;y+=128){g.beginPath();g.moveTo(0,y);g.lineTo(2048,y);g.stroke()}
  g.fillStyle='#c8d96a'; g.font='600 64px sans-serif'; g.textAlign='center';
  [['北',0],['東',512],['南',1024],['西',1536]].forEach(([t,x])=>{g.fillText(t,x+0,470); if(x===0) g.fillText(t,2048,470)});
  g.fillStyle='rgba(255,255,255,.6)'; g.font='32px sans-serif';
  g.fillText('サンプル：自分のパノラマ画像を選んでください',1024,620);
  return c;
}
let current = sample(); applyTexture(current);
status.textContent = 'サンプルを表示中';

document.getElementById('file').addEventListener('change',e=>{
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const r = img.width/img.height;
    current = img; applyTexture(img);
    status.textContent = f.name + '（' + img.width + '×' + img.height + '）' + (Math.abs(r-2)>.05 && layout==='mono' ? ' ※2:1ではないため歪みます' : '');
  };
  img.onerror = ()=>{ status.textContent='画像を読み込めませんでした。JPEGかPNGを選んでください'; };
  img.src = URL.createObjectURL(f);
});
document.getElementById('layout').addEventListener('change',e=>{ layout=e.target.value; applyTexture(current); });

/* --- 向きの制御 --- */
let lon=0, lat=0, drag=null, useGyro=false, ori=null, yawOffset=0;
const zee=new THREE.Vector3(0,0,1), eul=new THREE.Euler(), q0=new THREE.Quaternion(), q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const yawQ=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0);
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
addEventListener('deviceorientation',e=>{ if(e.alpha!==null) ori=e; });

async function enableGyro(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const s = await DeviceOrientationEvent.requestPermission();
      if(s!=='granted'){ status.textContent='モーションセンサーが許可されませんでした。設定から許可するか、ドラッグで見てください'; return false; }
    }
    useGyro = true; return true;
  }catch(err){ status.textContent='ジャイロを使えません（httpsで開いているか確認）'; return false; }
}

const panel = document.getElementById('ui');
let vr=false;
document.getElementById('vr').addEventListener('click', async ()=>{
  await enableGyro();
  vr=true; document.body.classList.add('vr'); panel.hidden=true;
  hint.textContent='タップでメニュー';
  setTimeout(()=>{ if(ori) yawOffset = 0; },300);
  resize();
});
document.getElementById('look').addEventListener('click', async ()=>{
  await enableGyro();
  vr=false; document.body.classList.remove('vr'); panel.hidden=true;
  hint.textContent='ドラッグ／スマホを動かして見回す・タップでメニュー';
  resize();
});

let downAt=0, moved=false;
R.domElement.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,lon,lat}; downAt=Date.now(); moved=false; });
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
  if(useGyro){ yawOffset = drag.lon + dx*.2; }
  else { lon = drag.lon - dx*.15; lat = Math.max(-85,Math.min(85, drag.lat + dy*.15)); }
});
addEventListener('pointerup',()=>{
  if(drag && !moved && Date.now()-downAt<300 && panel.hidden){ panel.hidden=false; hint.textContent=''; document.body.classList.remove('vr'); vr=false; resize(); }
  drag=null;
});

function updateCamera(){
  if(useGyro && ori){
    eul.set(THREE.MathUtils.degToRad(ori.beta), THREE.MathUtils.degToRad(ori.alpha), -THREE.MathUtils.degToRad(ori.gamma), 'YXZ');
    cam.quaternion.setFromEuler(eul);
    cam.quaternion.multiply(q1);
    cam.quaternion.multiply(q0.setFromAxisAngle(zee, -THREE.MathUtils.degToRad(screenAngle())));
    yawQ.setFromAxisAngle(up, THREE.MathUtils.degToRad(yawOffset));
    cam.quaternion.premultiply(yawQ);
  }else{
    const phi=THREE.MathUtils.degToRad(90-lat), th=THREE.MathUtils.degToRad(lon);
    cam.lookAt(500*Math.sin(phi)*Math.cos(th), 500*Math.cos(phi), 500*Math.sin(phi)*Math.sin(th));
  }
}

function resize(){
  R.setSize(innerWidth,innerHeight);
  cam.aspect = vr ? (innerWidth/2)/innerHeight : innerWidth/innerHeight;
  cam.fov = vr ? 90 : 75;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

function loop(){
  requestAnimationFrame(loop);
  updateCamera();
  const W=innerWidth, H=innerHeight;
  if(vr){
    R.setScissorTest(true);
    cam.layers.set(1); R.setViewport(0,0,W/2,H); R.setScissor(0,0,W/2,H); R.render(scene,cam);
    cam.layers.set(layout==='mono'?1:2); R.setViewport(W/2,0,W/2,H); R.setScissor(W/2,0,W/2,H); R.render(scene,cam);
    R.setScissorTest(false);
  }else{
    cam.layers.set(1); R.setViewport(0,0,W,H); R.render(scene,cam);
  }
}
resize(); loop();
})();
</script>
</body>
</html>
