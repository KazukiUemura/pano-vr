<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pano VR">
<title>Pano Cardboard</title>
<style>
:root{--bg:#0d0f0e;--fg:#e9ece8;--mute:#8d958f;--line:#2a2f2c;--acc:#c8d96a;--font:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));pointer-events:none}
#panel{pointer-events:auto;background:rgba(13,15,14,.9);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(440px,100%);max-height:100%;overflow:auto;display:grid;gap:12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
p{margin:0;font-size:12px;line-height:1.6;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;color:var(--mute)}
button,label.btn,select{font:inherit;font-size:14px;color:var(--fg);background:#1a1e1b;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600;flex:1}
button.sm{padding:8px 12px;font-size:13px}
input[type=file]{display:none}
#status{font-size:12px;color:var(--acc);min-height:1em;word-break:break-all}
#list{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#list button{flex:0 0 auto;font-size:12px;padding:6px 10px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list button.on{border-color:var(--acc);color:var(--acc)}
#hint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.45);pointer-events:none;white-space:nowrap}
#divider{position:fixed;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#333;display:none;pointer-events:none}
body.vr #divider{display:block}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#prog{position:fixed;left:0;top:0;height:2px;background:var(--acc);width:0;pointer-events:none;opacity:.6}
</style>
</head>
<body>
<div id="divider"></div>
<div id="fade"></div>
<div id="prog"></div>
<div id="ui"><div id="panel">
  <h1>Pano Cardboard</h1>
  <p>360°パノラマ（2:1）を複数追加して切り替えます。追加した画像はこの端末だけに保存され、次に開いたときも残ります。見ている間は<b>タップで次の画像</b>、<b>長押しでこのメニュー</b>。</p>

  <div class="row">
    <label class="btn" for="file">画像を追加（複数可）</label>
    <input id="file" type="file" accept="image/*" multiple>
    <button id="delone" class="sm">表示中を削除</button>
    <button id="clear" class="sm">すべて削除</button>
  </div>
  <div id="list"></div>

  <div class="row">
    <span class="lbl">自動切替</span>
    <select id="interval" aria-label="自動切替の間隔">
      <option value="0">しない</option>
      <option value="10">10秒</option>
      <option value="15" selected>15秒</option>
      <option value="30">30秒</option>
      <option value="60">60秒</option>
    </select>
    <select id="order" aria-label="順番">
      <option value="seq">順番に</option>
      <option value="rand">ランダム</option>
    </select>
    <select id="layout" aria-label="画像の形式">
      <option value="mono">モノ</option>
      <option value="tb">ステレオ上下</option>
      <option value="sbs">ステレオ左右</option>
    </select>
  </div>

  <div class="row">
    <button id="look">ドラッグで見る</button>
    <button id="vr" class="primary">ゴーグルで見る</button>
  </div>
  <div id="status"></div>
</div></div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
/* ---------- 端末内保存（IndexedDB） ---------- */
const DB={
  db:null,
  open(){ return new Promise((res)=>{ try{ const r=indexedDB.open('pano-cardboard',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('imgs',{keyPath:'id',autoIncrement:true});
    r.onsuccess=()=>{this.db=r.result;res(true)}; r.onerror=()=>res(false); }catch(e){res(false)} }); },
  tx(mode){ return this.db.transaction('imgs',mode).objectStore('imgs'); },
  all(){ return new Promise(res=>{ if(!this.db) return res([]); try{ const r=this.tx('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }catch(e){res([])} }); },
  add(rec){ return new Promise(res=>{ if(!this.db) return res(null); try{ const r=this.tx('readwrite').add(rec); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){res(null)} }); },
  del(id){ return new Promise(res=>{ if(!this.db) return res(); try{ const r=this.tx('readwrite').delete(id); r.onsuccess=r.onerror=()=>res(); }catch(e){res()} }); },
  clear(){ return new Promise(res=>{ if(!this.db) return res(); try{ const r=this.tx('readwrite').clear(); r.onsuccess=r.onerror=()=>res(); }catch(e){res()} }); }
};

const R = new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight);
document.body.prepend(R.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, .1, 2000);
const geo = new THREE.SphereGeometry(500,64,40); geo.scale(-1,1,1);
const matL = new THREE.MeshBasicMaterial(), matR = new THREE.MeshBasicMaterial();
const sL = new THREE.Mesh(geo,matL), sR = new THREE.Mesh(geo,matR);
sL.layers.set(1); sR.layers.set(2);
scene.add(sL,sR);

const $ = id=>document.getElementById(id);
const status=$('status'), hint=$('hint'), panel=$('ui'), fade=$('fade'), prog=$('prog'), listEl=$('list');
let layout='mono', current=null, texs=[];

function applyTexture(img){
  texs.forEach(t=>t.dispose());
  const tL=new THREE.Texture(img), tR=new THREE.Texture(img);
  [tL,tR].forEach(t=>{t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;t.needsUpdate=true});
  if(layout==='tb'){ tL.repeat.set(1,.5); tL.offset.set(0,.5); tR.repeat.set(1,.5); }
  if(layout==='sbs'){ tL.repeat.set(.5,1); tR.repeat.set(.5,1); tR.offset.set(.5,0); }
  texs=[tL,tR]; matL.map=tL; matR.map=tR; matL.needsUpdate=matR.needsUpdate=true;
}

function sample(){
  const c=document.createElement('canvas'); c.width=2048; c.height=1024;
  const g=c.getContext('2d');
  const sky=g.createLinearGradient(0,0,0,512); sky.addColorStop(0,'#1b2a3a'); sky.addColorStop(1,'#9fb4c4');
  g.fillStyle=sky; g.fillRect(0,0,2048,512); g.fillStyle='#3b3a33'; g.fillRect(0,512,2048,512);
  g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=2;
  for(let x=0;x<=2048;x+=128){g.beginPath();g.moveTo(x,0);g.lineTo(x,1024);g.stroke()}
  for(let y=0;y<=1024;y+=128){g.beginPath();g.moveTo(0,y);g.lineTo(2048,y);g.stroke()}
  g.fillStyle='#c8d96a'; g.font='600 64px sans-serif'; g.textAlign='center';
  [['北',0],['東',512],['南',1024],['西',1536],['北',2048]].forEach(([t,x])=>g.fillText(t,x,470));
  g.fillStyle='rgba(255,255,255,.6)'; g.font='32px sans-serif';
  g.fillText('サンプル：「画像を追加」から自分のパノラマを選んでください',1024,620);
  return c;
}

/* ---------- プレイリスト ---------- */
let items=[];   // {id, name, src}
let idx=0;
const cache=new Map();
function loadImg(src){
  if(cache.has(src)) return cache.get(src);
  const p=new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
  cache.set(src,p); p.catch(()=>cache.delete(src)); return p;
}
function renderList(){
  listEl.innerHTML='';
  items.forEach((it,i)=>{
    const b=document.createElement('button'); b.textContent=it.name; if(i===idx) b.className='on';
    b.onclick=()=>show(i); listEl.appendChild(b);
  });
}
let busy=false;
async function show(i, withFade){
  if(!items.length) return;
  idx=(i+items.length)%items.length;
  const it=items[idx]; busy=true;
  try{
    const imgP=loadImg(it.src);
    if(withFade){ fade.classList.add('on'); await new Promise(r=>setTimeout(r,350)); }
    const img=await imgP;
    current=img; applyTexture(img);
    status.textContent=(idx+1)+' / '+items.length+'　'+it.name+(Math.abs(img.width/img.height-2)>.05&&layout==='mono'?'（2:1でないため歪みます）':'');
    if(items.length>1) loadImg(items[(idx+1)%items.length].src).catch(()=>{});
  }catch(e){ status.textContent=it.name+' を読み込めませんでした'; }
  fade.classList.remove('on'); busy=false;
  renderList(); restartTimer();
}
function next(){ if(items.length<2||busy) return;
  const n=$('order').value==='rand' ? (idx+1+Math.floor(Math.random()*(items.length-1)))%items.length : idx+1;
  show(n,true);
}

function showSample(){ items=[]; idx=0; current=sample(); applyTexture(current); status.textContent='サンプルを表示中'; renderList(); }
async function restore(){
  const ok=await DB.open(); const recs=await DB.all();
  if(!recs.length){ if(!ok) status.textContent='この端末では保存が使えません（開き直すと選び直しになります）'; return; }
  items=recs.map(r=>({id:r.id, name:r.name, src:URL.createObjectURL(r.blob)}));
  await show(0);
}
$('file').addEventListener('change',async e=>{
  const fs=[...e.target.files].filter(f=>f.type.startsWith('image/')); e.target.value=''; if(!fs.length) return;
  const start=items.length; let failed=0;
  for(const f of fs){
    const id=await DB.add({name:f.name, blob:f, added:Date.now()}); if(id===null) failed++;
    items.push({id, name:f.name, src:URL.createObjectURL(f)});
  }
  await show(start);
  if(failed) status.textContent+='（'+failed+'枚は保存できませんでした。容量を確認してください）';
});
$('delone').addEventListener('click',async ()=>{
  if(!items.length) return; const it=items[idx];
  if(it.id!=null) await DB.del(it.id); URL.revokeObjectURL(it.src); cache.delete(it.src);
  items.splice(idx,1);
  if(items.length) show(Math.min(idx,items.length-1)); else showSample();
});
let clearArmed=false;
$('clear').addEventListener('click',async ()=>{
  if(!items.length) return;
  if(!clearArmed){ clearArmed=true; $('clear').textContent='もう一度押すと全削除'; setTimeout(()=>{clearArmed=false;$('clear').textContent='すべて削除'},3000); return; }
  clearArmed=false; $('clear').textContent='すべて削除';
  await DB.clear(); items.forEach(it=>URL.revokeObjectURL(it.src)); cache.clear(); showSample();
});
$('layout').addEventListener('change',e=>{ layout=e.target.value; if(current) applyTexture(current); });
$('interval').addEventListener('change',restartTimer);

/* ---------- 自動切替 ---------- */
let timerStart=0, timerLen=0;
function restartTimer(){ timerLen=+$('interval').value*1000; timerStart=performance.now(); }
function tickTimer(now){
  const running = timerLen>0 && items.length>1 && panel.hidden && !busy;
  if(!running){ prog.style.width='0'; if(!panel.hidden) timerStart=now; return; }
  const t=(now-timerStart)/timerLen;
  prog.style.width=Math.min(1,t)*100+'%';
  if(t>=1){ timerStart=now; next(); }
}

/* ---------- 向き ---------- */
let lon=0, lat=0, drag=null, useGyro=false, ori=null, yawOffset=0;
const zee=new THREE.Vector3(0,0,1), eul=new THREE.Euler(), q0=new THREE.Quaternion(), q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const yawQ=new THREE.Quaternion(), up=new THREE.Vector3(0,1,0);
const screenAngle=()=>(screen.orientation&&screen.orientation.angle)||window.orientation||0;
addEventListener('deviceorientation',e=>{ if(e.alpha!==null) ori=e; });

async function enableGyro(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      if(await DeviceOrientationEvent.requestPermission()!=='granted'){ status.textContent='モーションセンサーが許可されませんでした'; return false; }
    }
    useGyro=true; return true;
  }catch(e){ status.textContent='ジャイロを使えません（httpsで開いているか確認）'; return false; }
}

let vr=false;
function startView(){ panel.hidden=true; restartTimer(); resize(); }
$('vr').addEventListener('click', async ()=>{
  await enableGyro(); vr=true; document.body.classList.add('vr');
  hint.textContent=items.length>1?'タップで次へ・長押しでメニュー':'長押しでメニュー'; startView();
});
$('look').addEventListener('click', ()=>{
  useGyro=false; vr=false; document.body.classList.remove('vr');
  hint.textContent='ドラッグで見回す・タップで次へ・長押しでメニュー'; startView();
});
function openMenu(){ panel.hidden=false; hint.textContent=''; vr=false; document.body.classList.remove('vr'); resize(); }

let downAt=0, moved=false, pressTimer=null;
R.domElement.addEventListener('pointerdown',e=>{
  drag={x:e.clientX,y:e.clientY,lon,lat,yaw:yawOffset}; downAt=Date.now(); moved=false;
  clearTimeout(pressTimer); pressTimer=setTimeout(()=>{ if(drag&&!moved&&panel.hidden){ drag=null; openMenu(); } },600);
});
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>8){ moved=true; clearTimeout(pressTimer); }
  if(useGyro&&ori){ yawOffset=drag.yaw+dx*.2; }
  else { lon=drag.lon-dx*.15; lat=Math.max(-85,Math.min(85,drag.lat+dy*.15)); }
});
addEventListener('pointerup',()=>{
  clearTimeout(pressTimer);
  if(drag && !moved && Date.now()-downAt<400 && panel.hidden) next();
  drag=null;
});
addEventListener('contextmenu',e=>e.preventDefault());

function updateCamera(){
  if(useGyro&&ori){
    eul.set(THREE.MathUtils.degToRad(ori.beta), THREE.MathUtils.degToRad(ori.alpha), -THREE.MathUtils.degToRad(ori.gamma),'YXZ');
    cam.quaternion.setFromEuler(eul); cam.quaternion.multiply(q1);
    cam.quaternion.multiply(q0.setFromAxisAngle(zee,-THREE.MathUtils.degToRad(screenAngle())));
    cam.quaternion.premultiply(yawQ.setFromAxisAngle(up,THREE.MathUtils.degToRad(yawOffset)));
  }else{
    const phi=THREE.MathUtils.degToRad(90-lat), th=THREE.MathUtils.degToRad(lon);
    cam.lookAt(500*Math.sin(phi)*Math.cos(th),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(th));
  }
}
function resize(){
  R.setSize(innerWidth,innerHeight);
  cam.aspect=vr?(innerWidth/2)/innerHeight:innerWidth/innerHeight;
  cam.fov=vr?90:75; cam.updateProjectionMatrix();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));

function loop(now){
  requestAnimationFrame(loop);
  tickTimer(now); updateCamera();
  const W=innerWidth,H=innerHeight;
  if(vr){
    R.setScissorTest(true);
    cam.layers.set(1); R.setViewport(0,0,W/2,H); R.setScissor(0,0,W/2,H); R.render(scene,cam);
    cam.layers.set(layout==='mono'?1:2); R.setViewport(W/2,0,W/2,H); R.setScissor(W/2,0,W/2,H); R.render(scene,cam);
    R.setScissorTest(false);
  }else{ cam.layers.set(1); R.setViewport(0,0,W,H); R.render(scene,cam); }
}

showSample();
resize(); requestAnimationFrame(loop);
restore();
})();
</script>
</body>
</html>
